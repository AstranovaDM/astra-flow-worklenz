# Astra Flow staging overlay — files only; do not apply on a remote host from this agent.
# Usage (operator-run):
#   export FLOW_PROXY_PORT=18080
#   docker compose -f docker-compose.yml -f deploy/astra-flow-staging/docker-compose.astra-flow.yml up -d
#
# Prefers prebuilt images from the base compose. Resource caps, logging, restart
# policy, named volumes, and loopback-only proxy binding are enforced here.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    logging: *default-logging
    ports: !override
      - "127.0.0.1:5000:5000"

  backend:
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.75
    logging: *default-logging
    ports: !override
      - "127.0.0.1:3000:3000"

  client-portal:
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    logging: *default-logging
    ports: !override
      - "127.0.0.1:5174:5174"

  db:
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 0.75
    logging: *default-logging

  db-backup:
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging

  seaweedfs:
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"

  configure-seaweedfs:
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging

  # Reverse proxy — bound to loopback only; host port is required via FLOW_PROXY_PORT.
  nginx:
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${FLOW_PROXY_PORT:?Set FLOW_PROXY_PORT (e.g. 18080)}:80"

# Re-bind base volume keys to Astra Flow staging volume names (Postgres + object storage).
volumes:
  worklenz_postgres_data:
    name: astra_flow_postgres_data
  worklenz_seaweedfs_data:
    name: astra_flow_seaweedfs_data
