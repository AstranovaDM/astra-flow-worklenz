<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1677FF" />

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Astra Flow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Astra Flow" />
    <meta name="description" content="Astra Flow — project and workflow management for teams" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#1677FF" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Resource hints for better loading performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://js.hs-scripts.com" />

    <!-- Preload critical resources -->
    <link
      rel="preload"
      href="/locales/en/common.json"
      as="fetch"
      type="application/json"
      crossorigin
    />
    <link
      rel="preload"
      href="/locales/en/auth/login.json"
      as="fetch"
      type="application/json"
      crossorigin
    />
    <link
      rel="preload"
      href="/locales/en/navbar.json"
      as="fetch"
      type="application/json"
      crossorigin
    />

    <!-- Optimized font loading with font-display: swap -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>Astra Flow</title>

    <!-- Environment configuration -->
    <script src="/env-config.js"></script>

    <!-- Analytics Module -->
    <script src="/js/analytics.js" defer></script>
    <!-- Clarity Analytics -->
    <script src="/js/clarity.js" defer></script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
    <!-- HubSpot Integration Module -->
    <script src="/js/hubspot.js"></script>
  </body>
</html>
